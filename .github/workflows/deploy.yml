name: Build, test y deploy → Azure App Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test DeepArquitectura.slnx --configuration Release

      - name: Publicar
        run: dotnet publish src/DeepArquitectura.Web/DeepArquitectura.Web.csproj --configuration Release --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./publish

  deploy:
    # Solo despliega desde main (los PR únicamente compilan y testean).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: ./publish

      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz") && [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "La app no respondió 200 en /healthz" && exit 1

      - name: Logout Azure
        if: always()
        run: az logout
